<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#09090f">

    <title>{% block title %}Sign in{% endblock %} · BudgetWise</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="BudgetWise">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/mobile.css') }}">

</head>

<body class="auth-body">

<main class="auth-shell">

    <div class="auth-card">

        <div class="auth-logo">
            <i class="fa-solid fa-wallet"></i>
            <div>
                <h2>BudgetWise</h2>
                <p>Personal Finance</p>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flashes">
                    {% for category, message in messages %}
                        <div class="flash flash--{{ category }}">
                            <i class="fa-solid {{ 'fa-circle-check' if category == 'success' else 'fa-circle-exclamation' }}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}

    </div>

    <p class="auth-footnote">
        <i class="fa-solid fa-lock"></i>
        Your transactions are visible only to your account.
    </p>

</main>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>

</html>
